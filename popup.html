<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --surface: #f3f6fb;
      --text: #14213d;
      --muted: #5d6b82;
      --line: #dbe3ef;
      --accent: #2056a6;
      --accent-text: #ffffff;
      --key-bg: #ffffff;
      --key-edge: #b9c6da;
      --gold: #ffcd40;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12192a;
        --surface: #1b2438;
        --text: #eaf0fb;
        --muted: #9aa8c2;
        --line: #2b3752;
        --accent: #5b94e6;
        --accent-text: #0c1424;
        --key-bg: #263250;
        --key-edge: #0d1424;
      }
    }

    * { box-sizing: border-box; }
    body {
      width: 320px; margin: 0; padding: 16px;
      background: var(--bg); color: var(--text);
      font: 14px/1.5 "Sarabun", "Noto Sans Thai", "Leelawadee UI", Tahoma, system-ui, sans-serif;
    }

    header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    header img { width: 40px; height: 40px; border-radius: 10px; }
    h1 { margin: 0; font-size: 16px; line-height: 1.25; font-weight: 700; }
    header p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }

    section { margin-bottom: 14px; padding: 12px; background: var(--surface); border-radius: 12px; }
    h2 { margin: 0 0 8px; font-size: 13px; font-weight: 700; }

    .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 4px 0; }
    kbd {
      padding: 2px 9px; background: var(--key-bg); color: var(--text);
      border: 1px solid var(--key-edge); border-bottom-width: 3px; border-radius: 7px;
      font: 600 12px/1.6 system-ui, sans-serif; white-space: nowrap;
    }
    #change {
      margin-top: 8px; width: 100%; padding: 6px 10px; font: inherit; font-size: 13px;
      color: var(--accent); background: transparent; cursor: pointer;
      border: 1px solid var(--accent); border-radius: 8px;
    }
    #change:hover { background: var(--accent); color: var(--accent-text); }

    .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 3px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; }
    .seg label { position: relative; margin: 0; }
    .seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
    .seg span { display: block; padding: 5px 4px; text-align: center; font-size: 13px; border-radius: 7px; color: var(--muted); }
    .seg input:checked + span { background: var(--accent); color: var(--accent-text); font-weight: 600; }
    .seg input:focus-visible + span { outline: 2px solid var(--gold); outline-offset: 1px; }

    .switch-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 5px 0; cursor: pointer; }
    .switch {
      appearance: none; -webkit-appearance: none; flex: none; position: relative; margin: 0;
      width: 38px; height: 22px; background: var(--key-edge); border-radius: 11px; cursor: pointer;
      transition: background .15s;
    }
    .switch::after {
      content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px;
      background: #fff; border-radius: 50%; transition: transform .15s;
    }
    .switch:checked { background: var(--accent); }
    .switch:checked::after { transform: translateX(16px); }
    .switch:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

    .hint { margin: 0; font-size: 12px; color: var(--muted); }
    @media (prefers-reduced-motion: reduce) { .switch, .switch::after { transition: none; } }
  </style>
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="">
    <div>
      <h1>Auto Language Fixer</h1>
      <p>แก้ไทย ⇄ อังกฤษที่พิมพ์ผิดภาษา</p>
    </div>
  </header>

  <section>
    <h2>คีย์ลัด</h2>
    <div class="row"><span>แปลง</span><kbd id="shortcut">…</kbd></div>
    <div class="row"><span>แปลงทั้งช่อง</span><kbd id="shortcutAll">…</kbd></div>
    <button id="change" type="button">เปลี่ยนคีย์ลัด</button>
  </section>

  <section>
    <h2>ถ้าไม่ได้ไฮไลต์ข้อความ ให้แปลง</h2>
    <div class="seg" role="radiogroup">
      <label><input type="radio" name="mode" value="word"><span>คำล่าสุด</span></label>
      <label><input type="radio" name="mode" value="line"><span>ทั้งบรรทัด</span></label>
      <label><input type="radio" name="mode" value="all"><span>ทั้งช่อง</span></label>
    </div>
  </section>

  <section>
    <h2>ตัวเลือก</h2>
    <label class="switch-row"><span>แสดงข้อความแจ้งผลในหน้าเว็บ</span><input type="checkbox" class="switch" id="notify"></label>
    <label class="switch-row"><span>ข้ามช่องรหัสผ่าน</span><input type="checkbox" class="switch" id="skipPassword"></label>
  </section>

  <p class="hint">ไฮไลต์ข้อความก่อนกด จะแปลงเฉพาะส่วนที่ไฮไลต์ ตรวจทิศทางไทย ⇄ อังกฤษให้อัตโนมัติ</p>

  <script src="popup.js"></script>
</body>
</html>
